services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CPU_PROCESOS: "${CPU_PROCESOS:-2}"
      COLA_MAX: "${COLA_MAX:-100}"
      DESCARGAS_MAX: "${DESCARGAS_MAX:-20}"
      WORKERS: "${WORKERS:-3}"
      APAGADO_TIMEOUT: "${APAGADO_TIMEOUT:-10}"
      ESTADO_DIR: /app/datos
    volumes:
      - ./datos:/app/datos
    # Debe superar APAGADO_TIMEOUT y dar margen para limpieza y volcado.
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/estadisticas', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
